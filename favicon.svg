<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background rounded tile gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Top face gradient -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Left face gradient -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <!-- Right face gradient -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="cubeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base container with rounded corners -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5" />

  <!-- 3D Isometric Cube -->
  <g filter="url(#cubeGlow)">
    <!-- Top Face -->
    <polygon points="32,13 51,24 32,35 13,24" fill="url(#topFace)" />

    <!-- Left Face -->
    <polygon points="13,24 32,35 32,51 13,40" fill="url(#leftFace)" />

    <!-- Right Face -->
    <polygon points="32,35 51,24 51,40 32,51" fill="url(#rightFace)" />

    <!-- Isometric edges highlight -->
    <polyline points="13,24 32,35 51,24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-linejoin="round" />
    <line x1="32" y1="35" x2="32" y2="51" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  </g>
</svg>
