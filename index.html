<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web 3D Viewer - Interactive 3D Model Inspector</title>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=1.1.0" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">◈</div>
      <div>
        <h1>Web 3D Viewer</h1>
        <p>Drop a GLB, GLTF, FBX, OBJ, or STL model</p>
      </div>
    </div>
    <div class="header-actions">
      <label class="open-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span>Open Model</span>
        <input id="fileInput" type="file" accept=".glb,.gltf,.fbx,.obj,.stl,.mtl,.bin,.png,.jpg,.jpeg,.webp" multiple hidden />
      </label>
    </div>
  </header>

  <main id="viewer">
    <div id="dropZone" class="drop-zone">
      <div class="drop-card">
        <div class="drop-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </div>
        <h2>Drop 3D files here</h2>
        <p>Supports GLB, GLTF, FBX, OBJ, STL & texture maps</p>
        <button id="browseButton" class="btn-primary">Browse Files</button>
      </div>
    </div>

    <div id="loading" class="loading hidden">
      <div class="spinner"></div>
      <span id="loadingText">Loading model…</span>
    </div>

    <div id="toast" class="toast hidden"></div>

    <div id="toolbar" class="toolbar hidden">
      <div class="toolbar-group">
        <button id="resetCamera" title="Reset View">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span>Reset</span>
        </button>
        <button id="gridToggle" title="Toggle Grid">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/></svg>
          <span>Grid</span>
        </button>
        <button id="wireframeToggle" title="Toggle Wireframe">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><line x1="2" y1="7" x2="2" y2="17"/><line x1="12" y1="12" x2="12" y2="22"/><line x1="22" y1="7" x2="22" y2="17"/></svg>
          <span>Wireframe</span>
        </button>
        <button id="envToggle" title="Toggle Studio Lighting">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></svg>
          <span>Studio Light</span>
        </button>
      </div>

      <div id="animControls" class="toolbar-group hidden">
        <button id="playPauseAnim" title="Play/Pause Animation">
          <svg id="pauseIcon" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          <svg id="playIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <select id="animSelect" class="anim-select" title="Select Animation"></select>
      </div>
    </div>

    <div id="modelInfo" class="model-info hidden"></div>
  </main>

  <script type="module" src="./src/main.js?v=1.2.0"></script>
</body>
</html>
